name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: smartscan_test
          POSTGRES_USER: smartscan
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartscan -d smartscan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SMARTSCAN_TEST_POSTGRES_URL: postgresql+psycopg://smartscan:ci-only-password@localhost:5432/smartscan_test
      SMARTSCAN_DATABASE_URL: sqlite:///./ci-smartscan.db
      SMARTSCAN_STORAGE_ROOT: ./ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,vision]"
      - run: ruff check services migrations tests tools
      - run: ruff format --check services migrations tests tools
      - run: python tools/validate_ios_release.py
      - run: python tools/export_ai_schemas.py --check
      - run: python tools/export_ai_evaluation_schemas.py --check
      - run: pytest --cov=services --cov-report=term-missing --cov-fail-under=77
      - run: python tools/api_compatibility.py
      - run: python -m services.api.app.migrations upgrade
      - run: python -m services.api.app.migrations drift
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/h5/package-lock.json
      - run: node --check apps/h5/app.js
      - run: node --check apps/h5/auth-client.js
      - run: node --check apps/h5/camera.js
      - run: node --check apps/h5/book-auto-capture.js
      - run: node --check apps/h5/i18n.js
      - run: node --check apps/h5/page-editor.js
      - run: node --check apps/h5/project-files.js
      - run: node --check apps/h5/resumable-upload.js
      - run: npm ci
        working-directory: apps/h5
      - run: npx playwright install --with-deps chromium
        working-directory: apps/h5
      - run: npm test
        working-directory: apps/h5
      - run: npm run test:e2e
        working-directory: apps/h5
      - run: node --check apps/admin-web/app.js
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Android 分层、拍摄、编辑分享、单元测试与 Lint
        run: gradle -p apps/android :core:network:test :core:security:testDebugUnitTest :core:upload:test :core:update:test :data:repository:test :data:local:testDebugUnitTest :feature:capture:testDebugUnitTest :feature:sync:testDebugUnitTest :feature:update:testDebugUnitTest :feature:workspace:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug --stacktrace
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 选择固定 Xcode 16.4
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: 生成可复现 Xcode 工程
        run: sh apps/ios/scripts/generate-project.sh
      - name: Simulator 编译与单元测试
        run: sh apps/ios/scripts/run-simulator-tests.sh
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: 安装 staging 配置校验依赖
        run: python -m pip install "pyyaml>=6.0,<7" "cryptography>=46,<51"
      - name: 准备 Compose 校验环境变量
        run: cp .env.example .env
      - run: docker compose -f deploy/compose/docker-compose.yml config
        env:
          POSTGRES_PASSWORD: ci-only-password
      - name: 校验隔离 staging 配置契约
        run: >-
          python tools/validate_staging_config.py
          --deploy-env tests/fixtures/staging/deploy.env
          --runtime-env tests/fixtures/staging/runtime.env
          --ci-fixture
      - name: 解析隔离 staging Compose
        run: >-
          docker compose
          --env-file tests/fixtures/staging/deploy.env
          -f deploy/compose/docker-compose.staging.yml
          config
      - name: 生成并校验监控配置
        run: |
          mkdir -p "$RUNNER_TEMP/smartscan-monitoring"
          sed -n 's/^SMARTSCAN_OPS_METRICS_TOKEN=//p' \
            tests/fixtures/staging/runtime.env > "$RUNNER_TEMP/ops-metrics.token"
          chmod 600 "$RUNNER_TEMP/ops-metrics.token"
          python tools/render_monitoring_config.py \
            --runtime-env tests/fixtures/staging/runtime.env \
            --metrics-token-file "$RUNNER_TEMP/ops-metrics.token" \
            --alert-webhook-url https://alerts.ci.smartscan.test/hooks/staging \
            --target-dir "$RUNNER_TEMP/smartscan-monitoring" \
            --ci-fixture
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /bin/promtool \
            -v "$RUNNER_TEMP/smartscan-monitoring:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm --user "$(id -u):$(id -g)" --entrypoint /bin/amtool \
            -v "$RUNNER_TEMP/smartscan-monitoring:/etc/alertmanager:ro" \
            prom/alertmanager:v0.34.1 \
            check-config /etc/alertmanager/alertmanager.yml
      - name: 解析 monitoring Profile Compose
        run: >-
          docker compose
          --env-file tests/fixtures/staging/deploy.env
          -f deploy/compose/docker-compose.staging.yml
          -f deploy/compose/docker-compose.monitoring.yml
          --profile monitoring
          config
      - name: 构建 staging Web 镜像基线
        run: >-
          docker build
          --build-arg NGINX_BASE_IMAGE=nginx:1.27-alpine
          -f deploy/nginx/Dockerfile
          -t smartscan-web:ci .
      - name: 生成并验证 TLS 配置测试材料
        run: |
          mkdir -p "$RUNNER_TEMP/smartscan-tls"
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 30 \
            -subj "/CN=staging.ci.smartscan.test" \
            -addext "subjectAltName=DNS:staging.ci.smartscan.test" \
            -keyout "$RUNNER_TEMP/smartscan-tls/privkey.pem" \
            -out "$RUNNER_TEMP/smartscan-tls/fullchain.pem"
          chmod 600 "$RUNNER_TEMP/smartscan-tls/privkey.pem"
          python tools/validate_tls_material.py \
            --host staging.ci.smartscan.test \
            --certificate "$RUNNER_TEMP/smartscan-tls/fullchain.pem" \
            --certificate-key "$RUNNER_TEMP/smartscan-tls/privkey.pem" \
            --ci-fixture
          python tools/render_staging_edge.py \
            --host staging.ci.smartscan.test \
            --upstream-port 18080 \
            --certificate /etc/smartscan/staging/tls/fullchain.pem \
            --certificate-key /etc/smartscan/staging/tls/privkey.pem \
            --output "$RUNNER_TEMP/smartscan-edge.conf" \
            --ci-fixture
      - name: 校验主机 TLS Nginx 配置语法
        run: >-
          docker run --rm
          -v "$RUNNER_TEMP/smartscan-edge.conf:/etc/nginx/conf.d/default.conf:ro"
          -v "$RUNNER_TEMP/smartscan-tls:/etc/smartscan/staging/tls:ro"
          nginx:1.27-alpine nginx -t
      - name: 解析并启动内部文件发送集成环境
        run: >-
          docker compose
          -f deploy/compose/docker-compose.nginx-test.yml
          up -d --wait
      - name: 验证 Nginx internal、Range 与直访阻断
        run: python tools/verify_nginx_delivery.py
      - name: 清理内部文件发送集成环境
        if: always()
        run: |
          docker compose -f deploy/compose/docker-compose.nginx-test.yml ps
          docker compose -f deploy/compose/docker-compose.nginx-test.yml logs --no-color
          docker compose -f deploy/compose/docker-compose.nginx-test.yml down --remove-orphans
      - name: 构建可选 AI 网关镜像
        run: docker compose --profile ai -f deploy/compose/docker-compose.yml build ai-gateway
        env:
          POSTGRES_PASSWORD: ci-only-password

