name: UAT六镜像离线交付验证

on:
  pull_request:
    paths:
      - ".github/workflows/uat-offline-images.yml"
      - ".gitignore"
      - "deploy/releases/**"
      - "deploy/ocr-models/real-cpu-samples.json"
      - "deploy/compose/docker-compose.uat.yml"
      - "deploy/ops/smartscan-uatctl"
      - "deploy/ops/smartscan_uatctl.py"
      - "deploy/ops/smartscan_uat_validators.py"
      - "deploy/sudoers/smartscan-uatctl"
      - "tests/test_smartscan_offline_images.py"
      - "tests/test_smartscan_uatctl.py"
      - "tests/test_smartscan_uat_validators.py"
      - "tests/test_uat_config.py"
      - "tools/ci_verify_uatctl_checkpoint.py"
      - "tools/ci_verify_uatctl_permissions.sh"
      - "tools/ci_verify_uat_offline_docker.sh"
      - "tools/ocr_offline_layer.py"
      - "tools/smartscan_offline_images.py"
      - "tools/validate_uat_config.py"
      - "deploy/ops/smartscan_ocr_layer_contract.py"
      - "deploy/ops/smartscan_uat_ocr_model.py"
      - "deploy/ops/smartscan_uat_ocr_stage.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-offline-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scope:
    name: 识别当前增量候选
    runs-on: ubuntu-latest
    outputs:
      changed_service: ${{ steps.release.outputs.changed_service }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 读取单服务变化范围
        id: release
        run: |
          value="$(python - <<'PY'
          import json
          from tools import smartscan_offline_images as offline
          value=json.loads(offline.RELEASE_MANIFEST.read_text(encoding='utf-8'))
          changed=value.get('changed_services', [])
          if len(changed) != 1 or changed[0] not in {'worker','web'}:
              raise SystemExit('incremental_scope_invalid')
          print(changed[0])
          PY
          )"
          echo "changed_service=$value" >> "$GITHUB_OUTPUT"

  unit:
    name: ${{ matrix.os }}离线工具与控制器单元测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 固定Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装测试依赖
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: 执行专项测试
        run: python -m pytest tests/test_smartscan_offline_images.py tests/test_smartscan_uatctl.py tests/test_smartscan_uat_validators.py -q
      - name: 验证真实root所有权、sudo和固定权限契约
        if: runner.os == 'Linux'
        run: sudo unshare --uts --fork env "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" bash -c 'hostname ctiecaiserver && exec bash "$GITHUB_WORKSPACE/tools/ci_verify_uatctl_permissions.sh"'

  archive:
    name: 六镜像独立归档与完全离线导入
    needs: scope
    if: needs.scope.outputs.changed_service == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 固定Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: 生成六个独立Docker归档
        run: |
          python tools/smartscan_offline_images.py ci-build
          python tools/smartscan_offline_images.py ci-build-base-changed
      - name: 离线复核全部归档
        run: python tools/smartscan_offline_images.py verify
      - name: 从发布清单解析变化服务归档名
        id: changed_archive
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t values < <(python - <<'PY'
          import json
          from pathlib import Path
          from tools import smartscan_offline_images as offline

          manifest = json.loads(
              offline.RELEASE_MANIFEST.read_text(
                  encoding="utf-8"
              )
          )
          changed = manifest["changed_services"]
          if len(changed) != 1:
              raise SystemExit("changed_service_invalid")
          image = next(item for item in manifest["images"] if item["service"] == changed[0])
          archive_name = image["archive_name"]
          if Path(archive_name).name != archive_name or not archive_name.endswith(".docker.tar"):
              raise SystemExit("changed_archive_name_invalid")
          print(archive_name)
          print(manifest["release_id"])
          PY
          )
          echo "name=${values[0]}" >> "$GITHUB_OUTPUT"
          echo "release_id=${values[1]}" >> "$GITHUB_OUTPUT"
      - name: 严格扫描变化镜像全部Critical漏洞
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: .smartscan-offline-transfer/images/${{ steps.changed_archive.outputs.release_id }}/${{ steps.changed_archive.outputs.name }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: CRITICAL
      - name: 扫描变化镜像可修复High和Critical漏洞
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: .smartscan-offline-transfer/images/${{ steps.changed_archive.outputs.release_id }}/${{ steps.changed_archive.outputs.name }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
      - name: 下载并验证固定真实OCR模型Layer
        run: |
          python tools/ocr_offline_layer.py download
          python tools/ocr_offline_layer.py verify
      - name: 下载固定真实OCR样本
        run: |
          mkdir -p /tmp/smartscan-ocr/samples
          python - <<'PY'
          import hashlib,json,pathlib,urllib.request
          manifest=json.loads(pathlib.Path('deploy/ocr-models/real-cpu-samples.json').read_text())
          root=pathlib.Path('/tmp/smartscan-ocr/samples')
          for sample in manifest['samples']:
              path=root/f"{sample['id']}{pathlib.Path(sample['url']).suffix}"
              with urllib.request.urlopen(sample['url'], timeout=60) as response:
                  data=response.read()
              assert len(data)==sample['size'] and hashlib.sha256(data).hexdigest()==sample['sha256']
              path.write_bytes(data)
          PY
      - name: 安装固定Docker 29.0.2
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.0.2
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true,
                "lazy-pull": false
              },
              "proxies": {
                "http-proxy": "http://127.0.0.1:9",
                "https-proxy": "http://127.0.0.1:9",
                "no-proxy": "localhost,127.0.0.1"
              }
            }
      - name: 使用Docker 29 containerd image store完成相同离线门禁
        env:
          SMARTSCAN_DOCKER29_CONTAINERD: "1"
          SMARTSCAN_REAL_OCR_SAMPLES: /tmp/smartscan-ocr/samples
        run: bash tools/ci_verify_uat_offline_docker.sh
      - name: 使用独立无网络传统Docker daemon验证完整混合发布
        env:
          SMARTSCAN_REAL_OCR_SAMPLES: /tmp/smartscan-ocr/samples
        run: bash tools/ci_verify_uat_offline_docker.sh
      - name: 验证Compose完全禁止拉取
        run: |
          set -euo pipefail
          SMARTSCAN_UAT_RUNTIME_ENV_FILE="$GITHUB_WORKSPACE/tests/fixtures/uat/runtime.env" \
          docker compose --profile '*' \
            --env-file tests/fixtures/uat/deploy.env \
            --env-file tests/fixtures/uat/local-images.env \
            -f deploy/compose/docker-compose.uat.yml config --format json \
            > "$RUNNER_TEMP/uat-compose.json"
          python - "$RUNNER_TEMP/uat-compose.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          services = value["services"]
          expected = {
              "postgres", "migrate", "api", "worker-cpu-1", "worker-cpu-2",
              "worker-ai", "ai-gateway", "nginx", "loopback-proxy",
          }
          assert set(services) == expected
          assert all(item.get("pull_policy") == "never" for item in services.values())
          assert all(str(item.get("image", "")).startswith("smartscan-uat-") for item in services.values())
          PY
      - name: 输出中文归档大小摘要
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools import smartscan_offline_images as offline
          release=offline.load_release()
          value=json.loads((offline.DOWNLOAD_ROOT/release.release_id/'release-map.json').read_text())
          for image in value['images']:
              print(f"{image['service']}：{image['archive_size']} 字节，sha256:{image['archive_sha256']}")
          print(f"合计：{sum(item['archive_size'] for item in value['images'])} 字节")
          PY
      - name: 上传变化服务独立归档
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-changed-image
          path: .smartscan-offline-transfer/images/${{ steps.changed_archive.outputs.release_id }}/${{ steps.changed_archive.outputs.name }}
          retention-days: 14
          compression-level: 0
      - name: 上传中文发布映射和审核清单
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-release-map
          path: |
            .smartscan-offline-transfer/images/${{ steps.changed_archive.outputs.release_id }}/release-map.json
            .smartscan-offline-transfer/images/${{ steps.changed_archive.outputs.release_id }}/release-manifest.json
          retention-days: 14
      - name: 清理Runner临时归档
        if: always()
        run: rm -rf .smartscan-offline-transfer
