name: UAT六镜像离线交付验证

on:
  pull_request:
    paths:
      - ".github/workflows/uat-offline-images.yml"
      - ".gitignore"
      - "deploy/releases/**"
      - "deploy/compose/docker-compose.uat.yml"
      - "deploy/ops/smartscan-uatctl"
      - "deploy/ops/smartscan_uatctl.py"
      - "deploy/ops/smartscan_uat_validators.py"
      - "deploy/sudoers/smartscan-uatctl"
      - "tests/test_smartscan_offline_images.py"
      - "tests/test_smartscan_uatctl.py"
      - "tests/test_smartscan_uat_validators.py"
      - "tools/ci_verify_uatctl_checkpoint.py"
      - "tools/ci_verify_uat_offline_docker.sh"
      - "tools/smartscan_offline_images.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uat-offline-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit:
    name: ${{ matrix.os }}离线工具与控制器单元测试
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 固定Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装测试依赖
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: 执行专项测试
        run: python -m pytest tests/test_smartscan_offline_images.py tests/test_smartscan_uatctl.py tests/test_smartscan_uat_validators.py -q

  archive:
    name: 六镜像独立归档与完全离线导入
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: 固定Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: 生成六个独立Docker归档
        run: python tools/smartscan_offline_images.py ci-build
      - name: 离线复核全部归档
        run: python tools/smartscan_offline_images.py verify
      - name: 安装固定Docker 29.0.2
        uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: v29.0.2
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true,
                "lazy-pull": false
              },
              "proxies": {
                "http-proxy": "http://127.0.0.1:9",
                "https-proxy": "http://127.0.0.1:9",
                "no-proxy": "localhost,127.0.0.1"
              }
            }
      - name: 使用Docker 29 containerd image store完成相同离线门禁
        env:
          SMARTSCAN_DOCKER29_CONTAINERD: "1"
        run: bash tools/ci_verify_uat_offline_docker.sh
      - name: 使用独立无网络传统Docker daemon验证当前断点至迁移前门禁
        run: bash tools/ci_verify_uat_offline_docker.sh
      - name: 验证Compose完全禁止拉取
        run: |
          set -euo pipefail
          SMARTSCAN_UAT_RUNTIME_ENV_FILE="$GITHUB_WORKSPACE/tests/fixtures/uat/runtime.env" \
          docker compose --profile '*' \
            --env-file tests/fixtures/uat/deploy.env \
            --env-file tests/fixtures/uat/local-images.env \
            -f deploy/compose/docker-compose.uat.yml config --format json \
            > "$RUNNER_TEMP/uat-compose.json"
          python - "$RUNNER_TEMP/uat-compose.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          services = value["services"]
          expected = {
              "postgres", "migrate", "api", "worker-cpu-1", "worker-cpu-2",
              "worker-ai", "ai-gateway", "nginx",
          }
          assert set(services) == expected
          assert all(item.get("pull_policy") == "never" for item in services.values())
          assert all(str(item.get("image", "")).startswith("smartscan-uat-") for item in services.values())
          PY
      - name: 输出中文归档大小摘要
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value=json.loads(Path('.smartscan-offline-transfer/images/smartscan-uat-2026-11-24/release-map.json').read_text())
          for image in value['images']:
              print(f"{image['service']}：{image['archive_size']} 字节，sha256:{image['archive_sha256']}")
          print(f"合计：{sum(item['archive_size'] for item in value['images'])} 字节")
          PY
      - name: 上传PostgreSQL独立归档
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-postgres
          path: .smartscan-offline-transfer/images/smartscan-uat-2026-11-24/smartscan-postgres-94758173bbe1-linux-amd64.docker.tar
          retention-days: 14
          compression-level: 0
      - name: 上传API独立归档
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-api
          path: .smartscan-offline-transfer/images/smartscan-uat-2026-11-24/smartscan-api-80aea0a27279-linux-amd64.docker.tar
          retention-days: 14
          compression-level: 0
      - name: 上传Worker独立归档
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-worker
          path: .smartscan-offline-transfer/images/smartscan-uat-2026-11-24/smartscan-worker-f1cb15e434e9-linux-amd64.docker.tar
          retention-days: 14
          compression-level: 0
      - name: 上传AI Gateway独立归档
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-ai-gateway
          path: .smartscan-offline-transfer/images/smartscan-uat-2026-11-24/smartscan-ai-gateway-1813ada8bda2-linux-amd64.docker.tar
          retention-days: 14
          compression-level: 0
      - name: 上传Web独立归档
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-web
          path: .smartscan-offline-transfer/images/smartscan-uat-2026-11-24/smartscan-web-3d701a4bcaf2-linux-amd64.docker.tar
          retention-days: 14
          compression-level: 0
      - name: 上传Ops独立归档
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-ops
          path: .smartscan-offline-transfer/images/smartscan-uat-2026-11-24/smartscan-ops-be6c50fbdbc9-linux-amd64.docker.tar
          retention-days: 14
          compression-level: 0
      - name: 上传中文发布映射和审核清单
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smartscan-uat-offline-release-map
          path: |
            .smartscan-offline-transfer/images/smartscan-uat-2026-11-24/release-map.json
            .smartscan-offline-transfer/images/smartscan-uat-2026-11-24/release-manifest.json
          retention-days: 14
      - name: 清理Runner临时归档
        if: always()
        run: rm -rf .smartscan-offline-transfer
