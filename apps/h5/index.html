<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="SmartScan mobile document scanner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="progress.css">
  <link rel="stylesheet" href="camera.css">
  <link rel="stylesheet" href="auth.css">
  <link rel="stylesheet" href="capture.css">
  <link rel="stylesheet" href="editor.css">
  <title>SmartScan</title>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#home" aria-label="SmartScan home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>SmartScan</span>
      </a>
      <div class="topbar-actions">
        <button id="logoutButton" class="text-button hidden" data-i18n="logout" type="button">退出登录</button>
        <button id="languageButton" class="language" type="button" aria-label="Switch language">中 / EN</button>
      </div>
    </header>

    <main>
      <section id="authView" class="auth-view hidden">
        <div class="auth-copy">
          <p class="eyebrow" data-i18n="eyebrow">让纸张重新变得清晰</p>
          <h1 data-i18n="authTitle">扫描、整理，一气呵成。</h1>
          <p data-i18n="authText">一套账号连接企微、Android 与 iOS，原图始终由你掌控。</p>
        </div>
        <div class="panel form-panel">
          <form id="loginForm" class="auth-form">
            <label><span data-i18n="username">用户名</span><input name="username" autocomplete="username" required value="demo"></label>
            <label><span data-i18n="password">密码</span><input name="password" type="password" autocomplete="current-password" required></label>
            <button class="primary" data-i18n="login" type="submit">登录</button>
          </form>
          <div id="wecomActions" class="wecom-actions">
            <div class="auth-divider"><span data-i18n="or">或</span></div>
            <button id="wecomLoginButton" class="wecom-button" data-i18n="wecomLogin" type="button">企业微信登录</button>
          </div>
          <p id="authMessage" class="message" role="status"></p>
          <form id="phoneBindingForm" class="auth-form hidden">
            <div class="binding-copy"><h2 data-i18n="bindingTitle">验证安全手机号</h2><p data-i18n="bindingText">企业微信未提供可信手机号，请用短信验证后完成绑定。</p></div>
            <label><span data-i18n="phone">手机号（含国家码）</span><input id="bindingPhone" name="phone" type="tel" autocomplete="tel" placeholder="+8613800000000" required></label>
            <label><span data-i18n="smsCode">短信验证码</span><span class="code-row"><input name="sms_code" inputmode="numeric" autocomplete="one-time-code" minlength="4" maxlength="8" required><button id="sendBindingCode" class="secondary" data-i18n="sendCode" type="button">发送验证码</button></span></label>
            <button class="primary" data-i18n="finishBinding" type="submit">完成绑定</button>
            <button id="backToLogin" class="text-button" data-i18n="backToLogin" type="button">返回账号登录</button>
            <p id="bindingMessage" class="message" role="status"></p>
          </form>
        </div>
      </section>

      <section id="homeView">
        <div class="hero">
          <div>
            <p class="eyebrow" data-i18n="welcome">下午好</p>
            <h1><span data-i18n="capture">捕捉纸上的</span><br><em data-i18n="clarity">每一分清晰。</em></h1>
          </div>
          <div class="status-pill"><span></span><b data-i18n="localCore">基础能力可用</b></div>
        </div>

        <div class="mode-grid" aria-label="Scan modes">
          <button class="mode-card mode-card--hero" data-mode="document">
            <span class="mode-icon">⌗</span>
            <span class="mode-copy"><b data-i18n="smartScan">智能扫描</b><small data-i18n="smartScanDesc">自动裁边 · 文字转正 · 清晰增强</small></span>
            <span class="arrow">↗</span>
          </button>
          <button class="mode-card" data-mode="exam">
            <span class="mode-icon violet">✦</span>
            <span class="mode-copy"><b data-i18n="exam">试卷净化</b><small data-i18n="examDesc">保留印刷内容，标记低置信区域</small></span>
            <span class="arrow">›</span>
          </button>
          <button class="mode-card" data-mode="book">
            <span class="mode-icon amber">◫</span>
            <span class="mode-copy"><b data-i18n="book">连续扫书</b><small data-i18n="bookDesc">双页拆分 · 页码检查 · 快速成册</small></span>
            <span class="arrow">›</span>
          </button>
        </div>

        <div class="section-heading">
          <div><p class="eyebrow" data-i18n="library">资料库</p><h2 data-i18n="recent">最近项目</h2></div>
          <button id="refreshButton" class="text-button" data-i18n="refresh">刷新</button>
        </div>
        <div id="projectList" class="project-list">
          <div class="empty-state">
            <span>⌁</span><b data-i18n="empty">还没有扫描项目</b><small data-i18n="emptyHint">选择上方模式开始第一份扫描</small>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <a class="active" href="#home"><span>⌂</span><small data-i18n="home">首页</small></a>
      <button id="quickScan"><span class="scan-button">＋</span><small data-i18n="scan">扫描</small></button>
      <a href="#files"><span>▱</span><small data-i18n="files">文件</small></a>
    </nav>
  </div>

  <dialog id="captureDialog">
    <form method="dialog" class="capture-card" id="captureForm">
      <div class="dialog-head"><div><p class="eyebrow" data-i18n="newProject">新建项目</p><h2 id="captureTitle">智能扫描</h2></div><button value="cancel" aria-label="Close">×</button></div>
      <label><span data-i18n="projectTitle">项目名称</span><input id="projectTitle" required maxlength="160"></label>
      <div class="camera-tools">
        <button id="openCamera" class="secondary" type="button" data-i18n="openCamera">打开实时相机</button>
        <div id="cameraPanel" class="camera-panel hidden">
          <video id="cameraPreview" autoplay muted playsinline></video>
          <div>
            <button id="takePhoto" class="primary" type="button" data-i18n="takePhoto">拍摄页面</button>
            <button id="stopCamera" class="secondary" type="button" data-i18n="closeCamera">关闭相机</button>
          </div>
        </div>
      </div>
      <label class="file-drop"><input id="pageFile" type="file" accept="image/jpeg,image/png,image/webp,image/heic" capture="environment"><span>＋</span><b data-i18n="selectPage">拍摄或选择页面</b><small id="fileName" data-i18n="originalKept">原图会一直保留到你删除项目</small></label>
      <img id="capturePreview" class="capture-preview hidden" alt="待上传页面预览">
      <div id="uploadProgressWrap" class="upload-progress hidden" aria-live="polite">
        <div><span data-i18n="uploading">正在上传</span><b id="uploadPercent">0%</b></div>
        <progress id="uploadProgress" max="100" value="0"></progress>
      </div>
      <button id="submitCapture" class="primary" type="submit" value="default" data-i18n="createUpload">创建并上传</button>
      <p id="captureMessage" class="message" role="status"></p>
    </form>
  </dialog>

  <dialog id="editorDialog" class="editor-dialog">
    <div class="editor-card">
      <div class="dialog-head">
        <div><p class="eyebrow" data-editor-i18n="title">页面编辑</p><h2 id="editorProjectTitle">页面编辑</h2></div>
        <button id="closeEditor" type="button" aria-label="Close">×</button>
      </div>
      <div id="editorPageList" class="editor-page-list" aria-label="Pages"></div>
      <p id="qualityMessage" class="quality-message" role="status"></p>
      <div class="editor-stage">
        <img id="editorImage" alt="当前编辑页面">
        <svg id="cornerOverlay" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-label="四角裁切区域">
          <polygon id="cornerPolygon"></polygon>
          <circle data-corner="0" r="24"></circle><circle data-corner="1" r="24"></circle>
          <circle data-corner="2" r="24"></circle><circle data-corner="3" r="24"></circle>
        </svg>
      </div>
      <div class="editor-toolbar">
        <button id="rotatePageLeft" class="secondary" type="button" data-editor-i18n="rotateLeft">左转</button>
        <button id="rotatePageRight" class="secondary" type="button" data-editor-i18n="rotateRight">右转</button>
        <button id="movePageLeft" class="secondary" type="button" data-editor-i18n="moveLeft">前移</button>
        <button id="movePageRight" class="secondary" type="button" data-editor-i18n="moveRight">后移</button>
      </div>
      <div class="filter-row">
        <button class="filter-chip active" data-page-filter="original" type="button" data-editor-i18n="original">原图</button>
        <button class="filter-chip" data-page-filter="enhance" type="button" data-editor-i18n="enhance">增强</button>
        <button class="filter-chip" data-page-filter="grayscale" type="button" data-editor-i18n="grayscale">灰度</button>
        <button class="filter-chip" data-page-filter="bw" type="button" data-editor-i18n="bw">黑白</button>
      </div>
      <div class="editor-actions">
        <button id="resetCorners" class="secondary" type="button" data-editor-i18n="resetCorners">重置四角</button>
        <button id="confirmReview" class="secondary hidden" type="button" data-editor-i18n="confirm">确认已复核</button>
        <button id="savePageEdit" class="primary" type="button" data-editor-i18n="save">应用裁切与滤镜</button>
      </div>
      <section class="project-files" aria-labelledby="projectFilesTitle">
        <div class="project-files-heading">
          <h3 id="projectFilesTitle" data-editor-i18n="filesTitle">处理与导出</h3>
          <button id="refreshProjectFiles" class="text-button" type="button" data-editor-i18n="refreshFiles">刷新状态</button>
        </div>
        <div id="projectJobList" class="job-list" aria-live="polite"></div>
        <div class="export-controls">
          <label><span data-editor-i18n="format">格式</span><select id="exportFormat"><option value="pdf">PDF</option><option value="jpg">JPG</option></select></label>
          <label><span data-editor-i18n="quality">质量</span><select id="exportQuality"><option value="clear" data-editor-i18n="qualityClear">清晰</option><option value="balanced" selected data-editor-i18n="qualityBalanced">均衡</option><option value="small" data-editor-i18n="qualitySmall">小文件</option></select></label>
          <label class="ocr-option"><input id="exportOcr" type="checkbox"><span data-editor-i18n="includeOcr">PDF 包含 OCR 文本层</span></label>
          <button id="createExport" class="primary" type="button" data-editor-i18n="createExport">生成导出</button>
        </div>
        <div id="exportList" class="export-list"></div>
        <p id="projectFilesMessage" class="message" role="status"></p>
      </section>
      <p id="editorMessage" class="message" role="status"></p>
    </div>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
