name: smartscan
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartscan
      POSTGRES_USER: smartscan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartscan"]
      interval: 10s
      timeout: 5s
      retries: 8
  migrate:
    build: {context: ../.., dockerfile: services/api/Dockerfile}
    restart: "no"
    command: ["python", "-m", "services.api.app.migrations", "upgrade"]
    env_file: ../../.env
    environment:
      SMARTSCAN_DATABASE_URL: postgresql+psycopg://smartscan:${POSTGRES_PASSWORD}@postgres:5432/smartscan
      SMARTSCAN_STORAGE_ROOT: /srv/smartscan/data
      SMARTSCAN_ENV: production
      SMARTSCAN_AUTO_MIGRATE: "false"
    volumes: ["scan-data:/srv/smartscan/data"]
    depends_on: {postgres: {condition: service_healthy}}
  api:
    build: {context: ../.., dockerfile: services/api/Dockerfile}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      SMARTSCAN_DATABASE_URL: postgresql+psycopg://smartscan:${POSTGRES_PASSWORD}@postgres:5432/smartscan
      SMARTSCAN_STORAGE_ROOT: /srv/smartscan/data
      SMARTSCAN_INTERNAL_FILE_SEND_PREFIX: /_smartscan_files
      SMARTSCAN_ENV: production
      SMARTSCAN_AUTO_MIGRATE: "false"
    volumes: ["scan-data:/srv/smartscan/data"]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    expose: ["8000"]
  worker-cpu-1: &worker
    build: {context: ../.., dockerfile: services/worker/Dockerfile}
    restart: unless-stopped
    env_file: ../../.env
    environment:
      SMARTSCAN_DATABASE_URL: postgresql+psycopg://smartscan:${POSTGRES_PASSWORD}@postgres:5432/smartscan
      SMARTSCAN_STORAGE_ROOT: /srv/smartscan/data
      SMARTSCAN_ENV: production
      SMARTSCAN_AUTO_MIGRATE: "false"
      SMARTSCAN_OCR_MODEL_ROOT: /opt/smartscan/models/ocr
    volumes:
      - scan-data:/srv/smartscan/data
      - ../../models/ocr:/opt/smartscan/models/ocr:ro
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  worker-cpu-2: *worker
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../apps/h5:/var/www/h5:ro
      - ../../apps/admin-web:/var/www/admin:ro
      - scan-data:/srv/smartscan/data:ro
    depends_on: [api]
volumes:
  postgres-data:
  scan-data:

