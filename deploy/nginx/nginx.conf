events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  client_max_body_size 26m;
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  upstream api { server api:8000; keepalive 32; }
  server {
    listen 80;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    location / { root /var/www/h5; try_files $uri $uri/ /index.html; }
    location /admin/ { alias /var/www/admin/; try_files $uri $uri/ /admin/index.html; }
    location /api/ {
      proxy_pass http://api/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-ID $request_id;
      proxy_request_buffering off;
    }
    location ~ ^/api/v1/auth/(login|register)$ { limit_req zone=auth burst=5 nodelay; proxy_pass http://api; }
  }
}

