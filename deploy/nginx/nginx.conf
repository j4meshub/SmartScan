worker_processes auto;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  sendfile_max_chunk 1m;
  tcp_nopush on;
  keepalive_timeout 65s;
  keepalive_requests 1000;
  client_max_body_size 26m;
  client_body_timeout 120s;
  client_header_timeout 15s;
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  map $uri $auth_limit_key {
    default "";
    ~^/api/v1/auth/(login|register)$ $binary_remote_addr;
  }
  map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $scheme;
    http http;
    https https;
  }
  limit_req_zone $auth_limit_key zone=auth:10m rate=10r/m;
  upstream api { server api:8000; keepalive 32; }

  server {
    listen 80 default_server;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    location / { root /var/www/h5; try_files $uri $uri/ /index.html; }
    location /admin/ { alias /var/www/admin/; try_files $uri $uri/ /admin/index.html; }
    location /_smartscan_files/ {
      internal;
      alias /srv/smartscan/data/;
      disable_symlinks on from=/srv/smartscan/data;
      gzip off;
      etag off;
      add_header ETag $upstream_http_etag always;
      add_header X-Content-Type-Options nosniff always;
    }
    location /api/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://api/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_request_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream off;
    }
  }
}

