stages: [lint, unit-test, build]
default: {interruptible: true}
python-lint:
  stage: lint
  image: python:3.12
  script: ["pip install -e .[dev,vision]", "ruff check services migrations tests", "ruff format --check services migrations tests"]
unit-test:
  stage: unit-test
  image: python:3.12
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_DB: smartscan_test
    POSTGRES_USER: smartscan
    POSTGRES_PASSWORD: ci-only-password
    SMARTSCAN_TEST_POSTGRES_URL: postgresql+psycopg://smartscan:ci-only-password@postgres:5432/smartscan_test
    SMARTSCAN_DATABASE_URL: sqlite:///./ci-smartscan.db
    SMARTSCAN_STORAGE_ROOT: ./ci-data
  script: ["pip install -e .[dev,vision]", "pytest --cov=services --cov-report=term-missing --cov-fail-under=77", "python -m services.api.app.migrations upgrade", "python -m alembic check"]
web-check:
  stage: lint
  image: node:22
  script: ["node --check apps/h5/app.js", "node --check apps/admin-web/app.js"]
container-build:
  stage: build
  image: docker:27
  services: [docker:27-dind]
  script: ["docker build -f services/api/Dockerfile -t smartscan-api:$CI_COMMIT_SHA .", "docker build -f services/worker/Dockerfile -t smartscan-worker:$CI_COMMIT_SHA ."]

