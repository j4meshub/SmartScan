[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "smartscan"
version = "0.1.0"
description = "SmartScan unified scanning platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "argon2-cffi>=23.1,<26",
  "pillow>=10.4,<13",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]
vision = ["opencv-python-headless>=4.10,<5", "numpy>=2,<3"]

[tool.setuptools.packages.find]
include = ["services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services/api/tests", "services/worker/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-ignore = [
  "B008", # FastAPI intentionally uses Depends/File/Header calls in defaults.
  "BLE001", # Worker converts arbitrary image-decoder failures into retryable job state.
]

